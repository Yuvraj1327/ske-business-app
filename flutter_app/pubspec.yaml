name: ske_app
description: Sai Krishna Enterprises — Business Management Application
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Backend integration
  supabase_flutter: ^2.6.0
  dio: ^5.6.0

  # Secure storage for tokens (defense-in-depth; supabase_flutter also
  # persists its own session, but we keep this for any extra app-level state)
  flutter_secure_storage: ^9.2.2

  # Env config
  flutter_dotenv: ^5.1.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  file_picker: ^8.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

  # Branding: generate the real Android launcher icon / web favicon / splash
  # screen from the SK logo. These are dev tools that write generated files
  # into android/ and web/ when run — they don't ship in the app bundle
  # themselves. Run after `flutter pub get`:
  #   flutter pub run flutter_launcher_icons
  #   flutter pub run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png

# Configuration consumed by the `flutter_launcher_icons` dev-tool above —
# generates the Android launcher icon (and web app icons) from the same SK
# logo used in-app, so branding is consistent everywhere including release
# builds. iOS/macOS/Windows are left disabled since this project targets
# Android + Web (see README).
flutter_launcher_icons:
  android: true
  ios: false
  macos:
    generate: false
  windows:
    generate: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#173B63"

# Configuration consumed by the `flutter_native_splash` dev-tool above —
# generates the native splash screen (shown before Flutter itself has
# started) from the same SK logo, for both light and dark launch.
flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png
  color_dark: "#0E1420"
  image_dark: assets/logo.png
  android_12:
    image: assets/logo.png
    color: "#ffffff"
    image_dark: assets/logo.png
    color_dark: "#0E1420"
  web: true
